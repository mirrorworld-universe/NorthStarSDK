name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag and select npm channel
        id: release_tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          pattern="^v${number}\\.${number}\\.${number}(-devnet\\.${number})?$"
          if [[ ! "$TAG" =~ $pattern ]]; then
            echo 'Expected a stable tag or vMAJOR.MINOR.PATCH-devnet.N.' >&2
            exit 1
          fi
          git fetch origin refs/heads/release
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          version=${TAG#v}
          channel=latest
          if [[ "$version" == *-devnet.* ]]; then channel=devnet; fi
          printf 'version=%s\nchannel=%s\n' "$version" "$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update version
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release_tag.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
